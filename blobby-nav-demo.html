<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blobby Navigation Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #0a0e27;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .demo-container {
      text-align: center;
    }

    .demo-container h1 {
      margin-bottom: 30px;
      color: #ff6b6b;
    }

    .demo-container p {
      margin-bottom: 50px;
      color: #e0e0e0;
    }

    /* Blobby Navigation Styles */
    .blobby-nav-container {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 9999;
      display: block;
    }

    .blobby-nav {
      position: relative;
      width: 80px;
      height: 80px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .blobby-nav:hover {
      transform: scale(1.1);
    }

    .blobby-nav:active {
      transform: scale(0.95);
    }

    .blob-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 8px 20px rgba(255, 107, 107, 0.4));
      transition: filter 0.3s ease;
    }

    .blobby-nav:hover .blob-svg {
      filter: drop-shadow(0 12px 30px rgba(255, 107, 107, 0.6));
    }

    .blob-path {
      transition: all 0.3s ease;
    }

    /* Hamburger Icon Inside Blob */
    .hamburger-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 30px;
      height: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      pointer-events: none;
    }

    .hamburger-icon .line {
      width: 100%;
      height: 3px;
      background: white;
      border-radius: 3px;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    /* Active State - Transform to X */
    .blobby-nav.active .line1 {
      transform: translateY(10.5px) rotate(45deg);
    }

    .blobby-nav.active .line2 {
      opacity: 0;
      transform: translateX(-20px);
    }

    .blobby-nav.active .line3 {
      transform: translateY(-10.5px) rotate(-45deg);
    }

    /* Blob Animation on Click */
    .blobby-nav.active .blob-svg {
      animation: blobPulse 0.6s ease;
    }

    @keyframes blobPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
    }

    /* Pulsing Glow Effect */
    .blobby-nav::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 107, 107, 0.3) 0%, transparent 70%);
      border-radius: 50%;
      animation: glowPulse 2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glowPulse {
      0%, 100% {
        opacity: 0.5;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(1.2);
      }
    }

    /* Menu Panel */
    .menu-panel {
      position: fixed;
      left: -100%;
      top: 0;
      width: 100%;
      max-width: 350px;
      height: 100vh;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      padding: 40px 30px;
      transition: left 0.3s ease;
      z-index: 9998;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .menu-panel.show {
      left: 0;
    }

    .menu-panel h2 {
      color: #ff6b6b;
      margin-bottom: 30px;
      text-align: center;
    }

    .menu-panel ul {
      list-style: none;
    }

    .menu-panel ul li {
      margin-bottom: 15px;
    }

    .menu-panel ul li a {
      display: block;
      color: #e0e0e0;
      text-decoration: none;
      padding: 12px 15px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .menu-panel ul li a:hover {
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
      padding-left: 20px;
    }

    .status-text {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 107, 107, 0.1);
      border-radius: 8px;
      border-left: 4px solid #ff6b6b;
    }
  </style>
</head>
<body>
  <!-- Blobby Navigation -->
  <div class="blobby-nav-container">
    <div class="blobby-nav" id="blobbyNav">
      <svg class="blob-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="blobGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:1" />
          </linearGradient>
        </defs>
        <path class="blob-path" fill="url(#blobGradient)">
          <animate
            attributeName="d"
            dur="4s"
            repeatCount="indefinite"
            values="
              M45.7,-58.5C58.3,-49.4,67.3,-34.9,71.1,-19.1C74.9,-3.3,73.5,13.8,66.4,28.2C59.3,42.6,46.5,54.3,32.1,60.7C17.7,67.1,1.7,68.2,-14.8,66.3C-31.3,64.4,-48.3,59.5,-59.8,49.3C-71.3,39.1,-77.3,23.6,-77.8,7.8C-78.3,-8,-73.3,-24.1,-64.3,-37.4C-55.3,-50.7,-42.3,-61.2,-28.2,-69.5C-14.1,-77.8,0.2,-83.9,15.3,-82.6C30.4,-81.3,33.1,-67.6,45.7,-58.5Z;
              
              M41.3,-55.4C52.4,-45.8,59.3,-31.9,63.5,-17.1C67.7,-2.3,69.2,13.4,64.8,27.5C60.4,41.6,50.1,54.1,37.3,61.2C24.5,68.3,9.2,70,-5.6,67.8C-20.4,65.6,-34.7,59.5,-46.8,50.7C-58.9,41.9,-68.8,30.4,-72.9,17.1C-77,3.8,-75.3,-11.3,-68.9,-23.8C-62.5,-36.3,-51.4,-46.2,-39.1,-55.3C-26.8,-64.4,-13.4,-72.7,1.3,-74.4C16,-76.1,30.2,-65,41.3,-55.4Z;
              
              M38.8,-51.9C49.9,-42.3,58.3,-29.9,62.4,-16.1C66.5,-2.3,66.3,12.9,60.8,26.2C55.3,39.5,44.5,51,31.8,58.2C19.1,65.4,4.5,68.3,-10.7,67.8C-25.9,67.3,-41.7,63.4,-53.8,54.3C-65.9,45.2,-74.3,30.9,-76.4,15.7C-78.5,0.5,-74.3,-15.6,-66.3,-29.2C-58.3,-42.8,-46.5,-53.9,-33.8,-62.8C-21.1,-71.7,-7.5,-78.4,4.8,-75.8C17.1,-73.2,27.7,-61.5,38.8,-51.9Z;
              
              M45.7,-58.5C58.3,-49.4,67.3,-34.9,71.1,-19.1C74.9,-3.3,73.5,13.8,66.4,28.2C59.3,42.6,46.5,54.3,32.1,60.7C17.7,67.1,1.7,68.2,-14.8,66.3C-31.3,64.4,-48.3,59.5,-59.8,49.3C-71.3,39.1,-77.3,23.6,-77.8,7.8C-78.3,-8,-73.3,-24.1,-64.3,-37.4C-55.3,-50.7,-42.3,-61.2,-28.2,-69.5C-14.1,-77.8,0.2,-83.9,15.3,-82.6C30.4,-81.3,33.1,-67.6,45.7,-58.5Z"
          />
        </path>
      </svg>
      <div class="hamburger-icon">
        <span class="line line1"></span>
        <span class="line line2"></span>
        <span class="line line3"></span>
      </div>
    </div>
  </div>

  <!-- Menu Panel -->
  <div class="menu-panel" id="menuPanel">
    <h2>Navigation Menu</h2>
    <ul>
      <li><a href="#home">🏠 Home</a></li>
      <li><a href="#about">👤 About</a></li>
      <li><a href="#skills">📊 Skills</a></li>
      <li><a href="#portfolio">🖼️ Portfolio</a></li>
      <li><a href="#contact">✉️ Contact</a></li>
    </ul>
  </div>

  <!-- Demo Content -->
  <div class="demo-container">
    <h1>🎨 Blobby Navigation Demo</h1>
    <p>Click the pink blob in the top-left corner to see the animation!</p>
    <div class="status-text">
      <strong>Status:</strong> <span id="status">Menu Closed</span>
    </div>
  </div>

  <script>
    const blobbyNav = document.getElementById('blobbyNav');
    const menuPanel = document.getElementById('menuPanel');
    const statusText = document.getElementById('status');

    // Toggle menu on blob click
    blobbyNav.addEventListener('click', () => {
      blobbyNav.classList.toggle('active');
      menuPanel.classList.toggle('show');
      
      // Update status
      if (blobbyNav.classList.contains('active')) {
        statusText.textContent = 'Menu Open ✓';
        statusText.style.color = '#4ecdc4';
      } else {
        statusText.textContent = 'Menu Closed';
        statusText.style.color = '#e0e0e0';
      }
    });

    // Close menu when clicking menu items
    document.querySelectorAll('.menu-panel a').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        blobbyNav.classList.remove('active');
        menuPanel.classList.remove('show');
        statusText.textContent = 'Menu Closed';
        statusText.style.color = '#e0e0e0';
      });
    });

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      if (menuPanel.classList.contains('show')) {
        if (!menuPanel.contains(e.target) && !blobbyNav.contains(e.target)) {
          blobbyNav.classList.remove('active');
          menuPanel.classList.remove('show');
          statusText.textContent = 'Menu Closed';
          statusText.style.color = '#e0e0e0';
        }
      }
    });
  </script>
</body>
</html>
